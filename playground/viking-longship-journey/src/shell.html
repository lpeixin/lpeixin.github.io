<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Northbound — A Nordic Passage</title>
<meta name="description" content="An interactive 3D journey through a Nordic fjord aboard a Viking longship." />
<style>
  :root{
    --ink: #f4f0e6;
    --ink-dim: rgba(244,240,230,.62);
    --ink-faint: rgba(244,240,230,.38);
    --accent: #e3bd85;
    --glass: rgba(10,14,16,.34);
    --hair: rgba(255,255,255,.14);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Songti SC", serif;
    --sans: "Helvetica Neue", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:#070a0b; color:var(--ink); font-family:var(--sans); }
  body{ overscroll-behavior:none; }
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  #c.dragging{ cursor:grabbing; }

  #grade{
    position:fixed; inset:0; pointer-events:none; z-index:2;
    background:
      radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 42%, rgba(3,6,7,.42) 100%),
      linear-gradient(to bottom, rgba(4,7,8,.28) 0%, rgba(0,0,0,0) 18%, rgba(0,0,0,0) 74%, rgba(4,7,8,.34) 100%);
    mix-blend-mode: multiply;
    opacity:.9;
  }

  #ui{ position:fixed; inset:0; z-index:3; pointer-events:none; }
  #ui > *{ pointer-events:none; }

  #brand{
    position:absolute; left:clamp(18px,3.2vw,44px); top:clamp(18px,3vw,40px);
    transition:opacity .8s ease, transform .8s ease;
  }
  #brand h1{
    font-family:var(--serif); font-weight:400; font-size:clamp(26px,3.2vw,40px);
    letter-spacing:.005em; margin:0; line-height:1;
    text-shadow:0 2px 24px rgba(0,0,0,.55), 0 1px 2px rgba(0,0,0,.4);
  }
  #brand p{
    margin:.72em 0 0 .18em; font-size:9px; letter-spacing:.46em; text-transform:uppercase;
    color:var(--ink-dim); text-shadow:0 1px 10px rgba(0,0,0,.6);
  }

  #chapter{
    position:absolute; left:clamp(18px,3.2vw,44px); bottom:clamp(104px,15vh,150px);
    opacity:0; transform:translateY(10px);
    transition:opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.7,.2,1);
    max-width:min(46vw, 420px);
  }
  #chapter.show{ opacity:1; transform:none; }
  #chapter .num{
    font-size:9px; letter-spacing:.42em; text-transform:uppercase; color:var(--accent);
    display:block; margin-bottom:.9em; opacity:.9;
  }
  #chapter .ttl{
    font-family:var(--serif); font-size:clamp(19px,2.1vw,26px); line-height:1.24;
    color:rgba(248,245,237,.94); text-shadow:0 2px 18px rgba(0,0,0,.6);
  }
  #chapter .ttl em{ font-style:italic; color:rgba(248,245,237,.72); }

  #hint{
    position:absolute; left:50%; transform:translateX(-50%); bottom:clamp(88px,12vh,120px);
    font-size:9.5px; letter-spacing:.24em; text-transform:uppercase; color:var(--ink-faint);
    white-space:nowrap; transition:opacity 1.2s ease; text-shadow:0 1px 10px rgba(0,0,0,.7);
  }
  #hint b{ font-weight:400; color:var(--ink-dim); }

  #bar-wrap{
    position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:center;
    padding:0 14px calc(16px + env(safe-area-inset-bottom));
    transition:opacity .5s ease, transform .5s ease;
  }
  #bar{
    pointer-events:auto;
    display:flex; align-items:center; gap:2px;
    padding:6px; border-radius:999px;
    background:var(--glass);
    border:1px solid var(--hair);
    -webkit-backdrop-filter:blur(18px) saturate(1.25);
    backdrop-filter:blur(18px) saturate(1.25);
    box-shadow:0 10px 40px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.07);
    max-width:calc(100vw - 24px); flex-wrap:wrap; justify-content:center;
  }
  .btn{
    pointer-events:auto;
    appearance:none; background:transparent; border:0; color:rgba(244,240,230,.66);
    font-family:var(--sans); font-size:9.5px; letter-spacing:.18em; text-transform:uppercase;
    height:32px; padding:0 12px; border-radius:999px; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
    transition:background .25s ease, color .25s ease, opacity .25s ease;
  }
  .btn:hover{ background:rgba(255,255,255,.08); color:rgba(244,240,230,.95); }
  .btn:focus-visible{ outline:1px solid rgba(227,189,133,.7); outline-offset:1px; }
  .btn.is-on{ color:var(--accent); }
  .btn.is-on::before{
    content:""; width:4px; height:4px; border-radius:50%; background:var(--accent);
    box-shadow:0 0 8px rgba(227,189,133,.8); margin-left:-1px;
  }
  .btn .ico{ width:13px; height:13px; display:block; opacity:.85; }
  .sep{ width:1px; height:18px; background:rgba(255,255,255,.12); margin:0 4px; flex:0 0 auto; }

  #intro{
    position:absolute; inset:0; display:grid; place-items:center; z-index:5;
    background:radial-gradient(120% 100% at 50% 40%, rgba(8,12,14,.35) 0%, rgba(6,9,10,.86) 72%, rgba(4,6,7,.96) 100%);
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
    transition:opacity 1.4s ease, visibility 1.4s;
  }
  #intro.gone{ opacity:0; visibility:hidden; }
  /* the chrome stays out of the title card's way */
  body.intro-up #brand, body.intro-up #chapter, body.intro-up #hint, body.intro-up #bar { opacity:0; pointer-events:none; }
  #brand, #chapter, #hint, #bar { transition:opacity 1.1s ease; }
  #intro .inner{ text-align:center; padding:24px; max-width:680px; }
  #intro h2{
    font-family:var(--serif); font-weight:400; font-size:clamp(44px,8vw,86px); line-height:.98;
    margin:0 0 .34em; letter-spacing:-.005em;
    text-shadow:0 24px 80px rgba(0,0,0,.6);
  }
  #intro .sub{
    font-size:9.5px; letter-spacing:.5em; text-transform:uppercase; color:var(--ink-faint);
    margin:0 0 2.6em;
  }
  #intro .lede{
    font-family:var(--serif); font-size:clamp(14px,1.5vw,17px); line-height:1.75;
    color:rgba(244,240,230,.62); margin:0 auto 2.6em; max-width:34em; font-style:italic;
  }
  #begin{
    pointer-events:auto; appearance:none; cursor:pointer;
    background:transparent; color:var(--ink);
    border:1px solid rgba(244,240,230,.32); border-radius:999px;
    padding:13px 34px; font-family:var(--sans); font-size:10px; letter-spacing:.34em; text-transform:uppercase;
    transition:background .4s ease, border-color .4s ease, letter-spacing .6s ease;
  }
  #begin:hover{ background:rgba(244,240,230,.1); border-color:rgba(244,240,230,.6); letter-spacing:.4em; }
  #loadbar{ width:140px; height:1px; background:rgba(255,255,255,.14); margin:2.2em auto 0; overflow:hidden; }
  #loadbar i{ display:block; height:100%; width:0%; background:var(--accent); transition:width .4s ease; }

  #touch{
    position:absolute; inset:auto 0 calc(74px + env(safe-area-inset-bottom)) 0;
    display:none; justify-content:space-between; padding:0 14px;
  }
  #touch.on{ display:flex; }
  .tpad{ display:flex; gap:8px; pointer-events:auto; }
  .tbtn{
    pointer-events:auto; width:56px; height:56px; border-radius:50%;
    border:1px solid rgba(255,255,255,.16); background:rgba(10,14,16,.32);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    color:rgba(244,240,230,.8); font-size:18px; display:grid; place-items:center;
    user-select:none; touch-action:none;
  }
  .tbtn:active{ background:rgba(227,189,133,.22); }

  #dot{
    position:absolute; left:50%; bottom:24px; transform:translateX(-50%);
    width:34px; height:34px; border-radius:50%; border:1px solid rgba(255,255,255,.2);
    background:rgba(10,14,16,.35); display:none; place-items:center; pointer-events:auto; cursor:pointer;
  }
  #dot span{ width:4px; height:4px; border-radius:50%; background:rgba(255,255,255,.7); }

  body.ui-hidden #brand,
  body.ui-hidden #chapter,
  body.ui-hidden #hint,
  body.ui-hidden #bar-wrap,
  body.ui-hidden #touch{ opacity:0; pointer-events:none; transform:translateY(8px); }
  body.ui-hidden #dot{ display:grid; }

  #err{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:20;
    display:none; max-width:520px; padding:22px 26px; border:1px solid rgba(255,255,255,.16);
    background:rgba(8,10,12,.92); border-radius:10px; font-size:13px; line-height:1.6; color:#eee;
  }

  @media (max-width: 760px){
    #brand p{ letter-spacing:.34em; }
    #chapter{ bottom:auto; top:calc(96px + env(safe-area-inset-top)); max-width:70vw; }
    #hint{ display:none; }
    .btn{ padding:0 9px; font-size:9px; letter-spacing:.12em; height:30px; }
    .btn .label-long{ display:none; }
    .sep{ margin:0 2px; }
    #bar{ gap:0; padding:5px; }
    #bar-wrap{ padding-bottom:calc(10px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body class="intro-up">
<canvas id="c"></canvas>
<div id="grade"></div>

<div id="ui">
  <header id="brand">
    <h1>Northbound.</h1>
    <p>A Nordic Passage</p>
  </header>

  <div id="chapter">
    <span class="num"></span>
    <div class="ttl"></div>
  </div>

  <div id="hint"><b>A</b> / <b>D</b> steer &nbsp;·&nbsp; <b>W</b> / <b>S</b> speed &nbsp;·&nbsp; drag to look</div>

  <div id="bar-wrap">
    <div id="bar">
      <button class="btn" id="b-follow" data-cam="follow" title="Follow camera">Follow</button>
      <button class="btn" id="b-orbit" data-cam="orbit" title="Orbit camera">Orbit</button>
      <button class="btn" id="b-cinema" data-cam="cinema" title="Cinematic camera">Cinema</button>
      <span class="sep"></span>
      <button class="btn" id="b-light" title="Change light">Morning</button>
      <span class="sep"></span>
      <button class="btn" id="b-auto" title="Automatic journey">Auto</button>
      <button class="btn" id="b-sound" title="Sound">Sound</button>
      <span class="sep"></span>
      <button class="btn" id="b-pause" title="Pause">Pause</button>
      <button class="btn" id="b-reset" title="Reset">Reset</button>
      <button class="btn" id="b-full" title="Fullscreen">Full</button>
      <button class="btn" id="b-hide" title="Hide interface">Hide</button>
    </div>
  </div>

  <div id="touch">
    <div class="tpad">
      <div class="tbtn" id="t-left">&#8592;</div>
      <div class="tbtn" id="t-right">&#8594;</div>
    </div>
    <div class="tpad">
      <div class="tbtn" id="t-slow">&#8722;</div>
      <div class="tbtn" id="t-fast">+</div>
    </div>
  </div>

  <div id="dot" title="Show interface"><span></span></div>
</div>

<div id="intro">
  <div class="inner">
    <h2>Northbound<span style="opacity:.55">.</span></h2>
    <p class="sub">A Nordic Passage</p>
    <p class="lede">A wooden longship, a narrow fjord, and the low light of the north. Take the tiller and follow the water inland.</p>
    <button id="begin">Begin the voyage</button>
    <div id="loadbar"><i></i></div>
  </div>
</div>

<div id="err"></div>

<script>/*__THREE__*/</script>
<script>/*__APP__*/</script>
</body>
</html>
