<!-- 首屏防闪：在 CSS 生效前就把主题与语言定下来（此处内联是刻意的，不要外移）
     ?lang=zh|en 与 ?theme=light|dark 可以覆盖默认值，方便分享指定语言的链接 -->
<script>
(function () {
  try {
    var q = new URLSearchParams(location.search);

    var t = q.get('theme') || localStorage.getItem('site-theme');
    if (t !== 'light' && t !== 'dark') {
      t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = t;

    var l = q.get('lang') || localStorage.getItem('site-lang');
    if (l !== 'zh' && l !== 'en') {
      l = (navigator.language || 'zh').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
    }
    document.documentElement.dataset.lang = l;
    document.documentElement.lang = l === 'zh' ? 'zh-Hans' : 'en';
  } catch (e) {}
})();
</script>
