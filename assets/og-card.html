<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>OG card · 用无头浏览器截成 assets/og.png（1200×630）</title>
<style>
  /* 这个文件不参与站点页面，只用来生成 assets/og.png。
     改完重新截图即可：见 README「社交分享卡片」一节。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }

  body {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 76px 80px 64px;
    background: #ffffff;
    color: #17171c;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Noto Sans SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* 右上角极轻的网格，和站内首屏呼应 */
  .grid {
    position: absolute;
    inset: 0 0 auto auto;
    width: 640px;
    height: 460px;
    background-image:
      linear-gradient(to right, #e8e8ec 1px, transparent 1px),
      linear-gradient(to bottom, #e8e8ec 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(120% 100% at 100% 0%, #000 0%, transparent 72%);
    mask-image: radial-gradient(120% 100% at 100% 0%, #000 0%, transparent 72%);
  }

  .top { position: relative; display: flex; align-items: center; gap: 14px; }

  .mark {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border-radius: 12px;
    background: #5b5bd6;
    color: #fff;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 17px; font-weight: 700; letter-spacing: -0.5px;
  }
  .handle {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 15px; color: #85858f;
  }

  .mid { position: relative; }

  .role {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 7px 16px 7px 13px;
    border: 1px solid #e8e8ec;
    border-radius: 999px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 15px; color: #4d4d58;
    margin-bottom: 26px;
  }
  .role i { width: 7px; height: 7px; border-radius: 50%; background: #5b5bd6; }

  h1 {
    font-size: 68px;
    line-height: 1.06;
    letter-spacing: -0.035em;
    font-weight: 700;
  }

  .sub {
    margin-top: 20px;
    font-size: 21px;
    line-height: 1.5;
    color: #4d4d58;
    max-width: 30ch;
  }

  .bot {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .tag {
    padding: 7px 14px;
    border: 1px solid #e8e8ec;
    border-radius: 999px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px;
    color: #4d4d58;
  }
  .url {
    margin-left: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 15px;
    color: #5b5bd6;
  }

  /* 左侧强调色竖条 */
  .bar {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 8px;
    background: #5b5bd6;
  }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="grid"></div>

  <div class="top">
    <span class="mark">PL</span>
    <span class="handle">github.com/lpeixin</span>
  </div>

  <div class="mid">
    <span class="role"><i></i>Software Engineer · AI Agent Developer</span>
    <h1>Peixin&nbsp;Liu</h1>
    <p class="sub">MCP servers, Agent Skills, quantitative research and local-first knowledge tools.</p>
  </div>

  <div class="bot">
    <span class="tag">Python</span>
    <span class="tag">Swift</span>
    <span class="tag">LangChain</span>
    <span class="tag">MCP</span>
    <span class="url">lpeixin.github.io</span>
  </div>
</body>
</html>
